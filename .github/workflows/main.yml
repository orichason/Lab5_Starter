name: Unit Tests

on: push

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Run sum tests
        run: npm test ./__tests__/sum.test.js
      - name: Run unit tests
        run: npm test ./__tests__/unit.test.js
